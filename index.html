<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ed" />
    <meta
      name="description"
      content="Посылки — личный учёт заказов, товаров и приёмки посылок с распределением веса и стоимости доставки"
    />
    <title>Посылки — учёт заказов</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23d81b60'/><path d='M25 38 50 24l25 14v27L50 79 25 65z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/><path d='m25 38 25 14 25-14M50 52v27' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/></svg>"
    />
    <link rel="stylesheet" href="./src/app/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z" />
              <path d="m3 7.5 9 4.5 9-4.5M12 12v9" />
              <path d="M7.5 5.25 16.5 9.75" />
            </svg>
          </span>
          <span class="brand-text">
            <strong>Pindoчет</strong>
            <small>учёт посылок</small>
          </span>
        </div>
        <div class="header-actions">
          <button id="demoBtn" class="header-btn">Демо</button>
          <button id="backupBtn" class="header-btn">Резерв</button>
        </div>
      </header>

      <main id="main-content" class="flex-1 px-4 pb-28 overflow-y-auto">
        <div id="panel-container" style="view-transition-name: panel-root">
          <section id="panel-parcel" hidden><div id="parcelView"></div></section>
          <section id="panel-people" hidden><div id="peopleView"></div></section>
          <section id="panel-customer-detail" hidden><div id="customerDetailView"></div></section>
          <section id="panel-parcels"><div id="parcelListView"></div></section>
          <section id="panel-parcel-add" hidden><div id="parcelAddView"></div></section>
        </div>
      </main>

      <div class="bottombar-wrap">
        <div class="bottombar-shadow" aria-hidden="true"></div>
        <nav
          class="bottombar"
          id="bottombar"
          role="navigation"
          aria-label="Основная навигация"
        ></nav>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" role="status" aria-live="polite"></div>

    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
