<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="description" content="Посылки — личный учёт заказов, товаров и приёмки посылок с распределением веса и стоимости доставки">
<title>Посылки — учёт заказов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="./src/app/style.css">
</head>
<body class="bg-slate-100 text-slate-900 font-sans">
<div class="app max-w-2xl mx-auto px-3 pb-8 pt-safe">
  <header class="top flex items-center justify-between gap-3 py-4 px-1 mb-2">
    <div>
      <div class="brand text-2xl font-bold tracking-tight">Посылки</div>
      <div class="sub text-xs text-slate-500" id="profileLabel">Личный учёт заказов</div>
    </div>
    <div class="flex gap-2">
      <button class="secondary bg-slate-200 text-slate-900 px-4 py-2 rounded-xl" id="demoBtn">Демо</button>
      <button class="secondary bg-slate-200 text-slate-900 px-4 py-2 rounded-xl" id="backupBtn">База / резерв</button>
    </div>
  </header>
  <nav class="nav flex gap-1 overflow-auto py-1 px-0 mb-3" id="nav">
    <button data-tab="order" class="active bg-slate-800 text-white px-4 py-2 rounded-lg whitespace-nowrap">Текущий заказ</button>
    <button data-tab="items" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-lg whitespace-nowrap">Товары</button>
    <button data-tab="people" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-lg whitespace-nowrap">Заказчики</button>
    <button data-tab="history" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-lg whitespace-nowrap">История</button>
  </nav>
  <main id="main-content">
    <section id="panel-order"><div id="orderView"></div></section>
    <section id="panel-items" hidden><div id="itemsView"></div></section>
    <section id="panel-people" hidden><div id="peopleView"></div></section>
    <section id="panel-history" hidden><div id="historyView"></div></section>
  </main>
  <div class="foot text-xs text-slate-500 text-center py-3">Данные хранятся на этом устройстве. Регулярно сохраняйте резервную копию базы.</div>
</div>

<!-- Native dialog for all modals -->
<dialog id="sharedDialog"></dialog>

<!-- Toast container -->
<div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

<script type="module" src="./src/app/app.js"></script>
</body>
</html>
