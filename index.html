<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="description" content="Посылки — личный учёт заказов, товаров и приёмки посылок с распределением веса и стоимости доставки">
<title>Посылки — учёт заказов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="./src/app/style.css">
</head>
<body class="bg-slate-100 text-slate-900 font-sans">
<div class="app max-w-2xl mx-auto">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">Посылки</div>
      <div class="sub" id="profileLabel">Личный учёт заказов</div>
    </div>
    <div class="topbar-right">
      <button class="ghost" id="demoBtn" aria-label="Демо данные"></button>
      <button class="ghost" id="backupBtn" aria-label="Резервное копирование"></button>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <section id="panel-order"><div id="orderView"></div></section>
    <section id="panel-items" hidden><div id="itemsView"></div></section>
    <section id="panel-people" hidden><div id="peopleView"></div></section>
    <section id="panel-history" hidden><div id="historyView"></div></section>
  </main>

  <nav class="bottombar" id="bottombar" role="navigation" aria-label="Основная навигация"></nav>
</div>

<!-- Bottom sheet elements are created dynamically by utils.js -->

<!-- Toast container -->
<div id="toastContainer"></div>

<script type="module" src="./src/app/app.js"></script>
</body>
</html>
