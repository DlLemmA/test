<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="description" content="Посылки — личный учёт заказов, товаров и приёмки посылок с распределением веса и стоимости доставки">
<title>Посылки — учёт заказов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="./src/app/style.css">
</head>
<body class="bg-slate-100 text-slate-900">
<div class="max-w-2xl mx-auto min-h-screen flex flex-col">
  <header class="flex items-center justify-between gap-3 px-4 pt-4 pb-3 bg-slate-100 sticky top-0 z-10">
    <div class="flex flex-col gap-0.5">
      <div class="font-bold text-[22px] tracking-tight">Посылки</div>
      <div class="text-xs text-slate-500" id="profileLabel">Личный учёт заказов</div>
    </div>
    <div class="flex gap-2">
      <button id="demoBtn" class="bg-transparent rounded-xl px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-200 transition-colors">Демо</button>
      <button id="backupBtn" class="bg-transparent rounded-xl px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-200 transition-colors">Резерв</button>
    </div>
  </header>

  <main id="main-content" class="flex-1 px-4 pb-24 overflow-y-auto">
    <section id="panel-order"><div id="orderView"></div></section>
    <section id="panel-items" hidden><div id="itemsView"></div></section>
    <section id="panel-people" hidden><div id="peopleView"></div></section>
    <section id="panel-history" hidden><div id="historyView"></div></section>
  </main>

  <nav class="bottombar" id="bottombar" role="navigation" aria-label="Основная навигация"></nav>
</div>

<!-- Bottom sheet elements are created dynamically by utils.js -->

<!-- Toast container -->
<div id="toastContainer"></div>

<script type="module" src="./src/app/app.js"></script>
</body>
</html>
