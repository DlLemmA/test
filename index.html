<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#172033" />
    <meta
      name="description"
      content="Посылки — личный учёт заказов, товаров и приёмки посылок с распределением веса и стоимости доставки"
    />
    <title>Посылки — учёт заказов</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
    <link rel="stylesheet" href="./src/app/style.css" />
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="max-w-2xl mx-auto min-h-screen flex flex-col">
      <header
        class="flex items-center justify-between gap-3 px-4 pt-1.5 pb-2 bg-slate-100/80 backdrop-blur-md sticky top-0 z-10 safe-area-inset-top shadow-[0_1px_3px_rgba(0,0,0,0.05)]"
      >
        <div class="flex flex-col gap-0.5">
          <div class="font-bold text-[24px] tracking-tight">Pindoчет</div>
        </div>
        <div class="flex gap-2">
          <button
            id="demoBtn"
            class="bg-transparent rounded-xl px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-200 transition-colors"
          >
            Демо
          </button>
          <button
            id="backupBtn"
            class="bg-transparent rounded-xl px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-200 transition-colors"
          >
            Резерв
          </button>
        </div>
      </header>

      <main id="main-content" class="flex-1 px-4 pb-28 overflow-y-auto">
        <div id="panel-container" style="view-transition-name: panel-root">
          <section id="panel-parcel" hidden><div id="parcelView"></div></section>
          <section id="panel-people" hidden><div id="peopleView"></div></section>
          <section id="panel-customer-detail" hidden><div id="customerDetailView"></div></section>
          <section id="panel-parcels"><div id="parcelListView"></div></section>
          <section id="panel-parcel-add" hidden><div id="parcelAddView"></div></section>
        </div>
      </main>

      <nav class="bottombar" id="bottombar" role="navigation" aria-label="Основная навигация"></nav>
    </div>

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
